services:
  slock:
    build:
      context: .
      args:
        PLUGINS: ${PLUGINS:-core}
    ports:
      - "127.0.0.1:${SLOCK_PORT:-5175}:5175"
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5175').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
    restart: unless-stopped

volumes:
  data:
